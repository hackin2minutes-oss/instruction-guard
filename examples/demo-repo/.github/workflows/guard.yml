# Example: how a downstream repo would use the Action as a PR gate.
name: instruction-guard

on:
  pull_request:
  push:

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # required to upload SARIF
    steps:
      - uses: actions/checkout@v4

      - name: Instruction Supply Chain Guard
        id: guard
        uses: hackin2minutes-oss/instruction-guard@v1
        with:
          root: "."
          fail-on: "high"

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.guard.outputs.sarif }}
