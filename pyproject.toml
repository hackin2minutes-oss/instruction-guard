[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "instruction-guard"
version = "0.2.0"
description = "Govern the instruction artifacts AI agents obey: inventory, scan, lock, detect drift."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sawan Bhan" }]
keywords = ["devsecops", "ai-security", "mlsecops", "prompt-injection", "mcp", "supply-chain"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
]
dependencies = []  # standard library only

[project.scripts]
instruction-guard = "instruction_guard.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "cryptography>=41"]
sign = ["cryptography>=41"]

[tool.setuptools]
packages = ["instruction_guard"]
